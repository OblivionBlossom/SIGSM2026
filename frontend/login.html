<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vista de documento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="container-fluid border-bottom p-2" style="background-color: #f8f9fa;">
        <div class="row align-items-center">
            <div class="col-auto ps-3">
                <img src="logoHospi.jpg" alt="Hospital" height="80">
            </div>
            <div class="col d-flex align-items-center justify-content-evenly p-4">
                <div class="dropdown">
                    <button class="btn btn-link text-dark text-decoration-none dropdown-toggle fw-medium" type="button" data-bs-toggle="dropdown" aria-expanded="false">Principal</button>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="index.html">Volver a pagina Principal</a></li>
                    </ul>
                </div>
                <div class="dropdown">
                    <button class="btn btn-link text-dark text-decoration-none dropdown-toggle fw-medium" type="button" data-bs-toggle="dropdown" aria-expanded="false">Documentos</button>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="#">Cardiologia</a></li>
                        <li><a class="dropdown-item" href="#">Opcion 2</a></li>
                        <li><a class="dropdown-item" href="#">Opcion 3</a></li>
                    </ul>
                </div>
                <div class="dropdown">
                    <a class="btn btn-link text-dark text-decoration-none dropdown-toggle fw-medium" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">Encuestas</a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="encuestaVistaGeneral.html">Ingresar a encuesta</a></li>
                    </ul>
                </div>
                <span class="text-dark fw-bold fs-5">Acceso</span>
            </div>
        </div>
    </div>
    <section class="container-fluid d-flex align-items-center py-5" style="background-image: url('imagenFondo.jpeg'); background-size: cover; background-position: center; min-height: 80vh;">
        <div class="container">
            <div class="row">
                <div class="col-md-6 col-lg-5">
                    <div class="bg-white p-5 rounded shadow-lg">
                        <div class="text-center mb-4">
                            <h2 class="fw-bold fs-3" style="font-family: serif;">Inicio de sesión</h2>
                            <p class="text-muted small">ingresa con tus credenciales</p>
                        </div>
                        <form>
                            <div class="mb-3">
                                <label class="form-label fw-bold small">Correo electronico</label>
                                <input type="email" class="form-control bg-light text-muted" value="correo@gmail.com" readonly>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold small">Contraseña</label>
                                <input type="password" class="form-control bg-light text-muted" value="•••••••" readonly>
                            </div>
                           <div class="d-grid">
                                <button type="submit" class="btn text-white fw-bold py-2" style="background-color: #9ec5fe;">iniciar sesion</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
